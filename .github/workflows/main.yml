name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]

jobs:

  build:
    runs-on: [self-hosted, linux]

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found. Installing..."
            sudo dnf install -y maven
          else
            echo "Maven is already installed"
          fi
          mvn -version

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      - name: Check generated WAR
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "WAR files:"
          find target -name "*.war" -type f

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war


  deploy:
    runs-on: [self-hosted, linux]
    needs: build
    environment: production

    steps:

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      - name: Check downloaded WAR
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "WAR files:"
          find . -name "*.war" -type f

      - name: Deploy to Tomcat
        run: |
          WAR_FILE=$(find . -maxdepth 2 -name "*.war" -type f | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found!"
            exit 1
          fi

          echo "Deploying $WAR_FILE to Tomcat..."
          echo "Deploying || ${{ secrets.TOMCAT_USER }} == $secrets.TOMCAT_USER == $TOMCAT_USER.TOMCAT_USER || to Tomcat..."

          curl -v --upload-file "$WAR_FILE" \
            http://tomcat:root123456@h3.108.60.39:8080/manager/text/deploy?path=/myapp&update=true
